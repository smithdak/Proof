name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Work-control validation proves the P-0007 candidate, Engineering
          # evidence, and Assurance record ancestry before allowing `done`.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Run documentation tests
        run: cargo test --locked --doc --workspace --all-features

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      - name: Check work-item control plane
        run: node scripts/check-work-items.mjs
