# Proof deployable stack: one command bring-up.
#
#   docker compose -f deploy/compose.yml up --build
#
# Brings up PostgreSQL, the proof-server HTTP boundary, and the proof-worker
# delivery worker against the same authority store. The server applies the
# migration ledger on first start; the worker applies the delivery-state
# migration and drains the transactional outbox in bounded passes.

name: proof

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proof
      POSTGRES_DB: prooftest
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d prooftest"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROOF_PG_DSN: postgres://proof@postgres:5432/prooftest
      PROOF_LISTEN_ADDR: 0.0.0.0:8080
      PROOF_WORKSPACE_ID: 019c0000-0000-7000-8000-000000000010
      # Generate a real secret for anything beyond local evaluation:
      #   openssl rand -hex 32
      PROOF_SESSION_SECRET: ${PROOF_SESSION_SECRET:-5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a}
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # The reference worker is a single bounded pass; loop it for a
    # long-running deployment.
    command:
      - |
        while true; do
          PROOF_PREVIEW_ROOT=/var/lib/proof/preview \
          PROOF_PG_DSN="$${PROOF_PG_DSN}" \
          PROOF_WORKSPACE_ID="$${PROOF_WORKSPACE_ID}" \
          proof-worker || exit 1
          sleep 5
        done
    environment:
      PROOF_PG_DSN: postgres://proof@postgres:5432/prooftest
      PROOF_WORKSPACE_ID: 019c0000-0000-7000-8000-000000000010
      PROOF_PREVIEW_ROOT: /var/lib/proof/preview
    volumes:
      - preview:/var/lib/proof/preview

volumes:
  pgdata:
  preview:
